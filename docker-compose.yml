services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      TELEMETRY_DB_PATH: /data/telemetry.db
    volumes:
      - telemetry-data:/data
    restart: unless-stopped
    healthcheck:
      # 镜像基于 python:3.12-slim，无 curl/wget，用标准库探测 /health
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://localhost:8000/health', timeout=3); assert r.status == 200 and json.load(r)['status'] == 'ok'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  telemetry-data:
